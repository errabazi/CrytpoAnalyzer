
name: Build Bitget Crypto Analyzer APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: "false"
          packages: ""

      - name: Accept licenses and install SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract project
        run: |
          unzip -o BitgetCryptoAnalyzer-Android-Source.zip -d .
          test -f BitgetCryptoAnalyzer/build.gradle.kts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle -p BitgetCryptoAnalyzer assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BitgetCryptoAnalyzer-debug-apk
          path: BitgetCryptoAnalyzer/app/build/outputs/apk/debug/app-debug.apk
